# Candidate open-weight ASR models with Arabic support, compiled 2026-10-22.
# Every hf_id under `models:` and every `hf_exists: true` under `excluded:` returned HTTP 200 from
# https://huggingface.co/api/models/<id> on 2026-10-22; downloads_30d is the Hub's last-30-day counter at that time.
# weights_gb is the approximate on-disk size of the primary (bf16/fp32 as published) weights, not the whole repo.
# arabic_support: native | finetuned | multilingual-includes-ar | unverified.
# streaming: native | chunked | no | unknown.  timestamps: word | segment | char | no | unknown.
# priority: 1 = must include, 2 = include, 3 = nice to have.
# Sources: HF Hub API + model cards, Elm Open Universal Arabic ASR Leaderboard (space + GitHub changelog),
# vendor blogs (Cohere, Mistral, Meta omnilingual-asr paper), benchmarklist.com mirror of the Elm table (2026-05).

