# Model cards for the board. model_id must match tahqiq/models/registry.py (or a submission slug).
# Declared production fields come from the model card / paper; the source is cited per entry.
#   streaming:  native | chunked | no       (native = the model is trained/served for streaming;
#                                            chunked = offline model, usable with chunked pseudo-streaming)
#   timestamps: word | segment | char | no
