# Model cards for the board. model_id must match tahqiq/models/registry.py (or a submission slug).
# Declared production fields come from the model card / paper; the source is cited per entry.
#   streaming:  native | chunked | no       (native = the model is trained/served for streaming;
#                                            chunked = offline model, usable with chunked pseudo-streaming)
#   timestamps: word | segment | char | no
#   max_audio:  what the model accepts in one call (long-form via chunking noted)
# Community submissions get "unknown" until a maintainer fills them in.
models:
  whisper_large_v3:
    name: Whisper large-v3
    org: OpenAI
    kind: open
    hf: https://huggingface.co/openai/whisper-large-v3
    license: apache-2.0
    params: 1.55B
    streaming: chunked
    timestamps: word
    max_audio: 30 s window; long-form by chunking
    languages: 99 (multilingual)
    arabic_only: false
    declared_source: https://huggingface.co/openai/whisper-large-v3
  whisper_large_v3_turbo:
    name: Whisper large-v3-turbo
    org: OpenAI
