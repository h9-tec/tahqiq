[project]
name = "harfiyyan"
version = "0.0.1"
description = "Harfiyyan (حرفياً): a reproducible Arabic ASR leaderboard with confidence intervals, dialect columns, and commercial APIs on the same table."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Hesham Haroon" }]
dependencies = [
    "jiwer>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "httpx>=0.27",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
data = ["datasets>=2.20", "librosa>=0.10", "pyarrow>=15"]
gpu = ["torch>=2.3", "transformers>=4.44", "accelerate>=0.33", "librosa>=0.10"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harfiyyan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a GPU and model weights (skipped in CI)",
    "api: needs vendor API keys (skipped in CI)",
]
addopts = "-m 'not gpu and not api'"

[tool.ruff]
line-length = 100
